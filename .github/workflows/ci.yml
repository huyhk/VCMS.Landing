name: VCMS Landing CI

on:
  push:
    branches: [ master, feature/reusable-landing-sections ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore LandingCms.sln
      - run: dotnet build LandingCms.sln -c Release --no-restore
      - run: dotnet test LandingCms.sln -c Release --no-build
